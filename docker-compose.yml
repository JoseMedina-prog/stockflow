services:
  app:
    build: .
    container_name: stockflow_app
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
      - node_modules_data:/var/www/html/node_modules
    ports:
      - "8000:8000"
    command: ["serve"]
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: stockflow_db
    environment:
      MYSQL_DATABASE: stockflow
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: stockflow
      MYSQL_PASSWORD: secret
    ports:
      - "3307:3306"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  dbdata:
  vendor_data:
  node_modules_data:
